name: Tests memoria historica

on:
  push:
    branches:
      - feature/status-upcoming-live-finished
    paths:
      - 'db.py'
      - 'historial_rendimiento.py'
      - 'radar_necesidad.py'
      - 'test_radar_necesidad.py'
      - 'perfil_jugadores.py'
      - 'test_historial_rendimiento.py'
      - 'test_perfil_jugadores.py'
      - 'test_db.py'
      - 'test_analisis_jugadores.py'
      - 'inteligencia_torneo.py'
      - 'rendimiento_presion.py'
      - 'test_rendimiento_presion.py'
      - 'tablas_scraper.py'
      - 'reconstruccion_torneo.py'
            test_reconstruccion_torneo.py \
      - 'test_inteligencia_torneo.py'
      - 'inspeccionar_hoja_partido.py'
      - 'test_inspeccionar_hoja_partido.py'
      - 'requirements.txt'
      - '.github/workflows/test-memoria-historica.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/status-upcoming-live-finished
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de pruebas
        run: pip install "psycopg[binary]==3.2.6" playwright
      - name: Ejecutar pruebas
        run: |
          python -m unittest -v \
            test_analisis_jugadores.py \
            test_db.py \
            test_inteligencia_torneo.py \
            test_rendimiento_presion.py \
            test_historial_rendimiento.py \
            test_radar_necesidad.py \
            test_perfil_jugadores.py \
            test_reconstruccion_torneo.py \
            test_inspeccionar_hoja_partido.py

  historical-reports:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/status-upcoming-live-finished
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar PostgreSQL driver
        run: pip install "psycopg[binary]==3.2.6"
      - name: Generar informes históricos (solo lectura de PostgreSQL)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || (echo "Falta el secreto DATABASE_URL" && exit 1)
          python perfil_jugadores.py
          python historial_rendimiento.py
          python radar_necesidad.py
      - name: Publicar informes
        uses: actions/upload-artifact@v4
        with:
          name: informes-historicos-liga-pro
          path: |
            salida/perfiles_jugadores.json
            salida/rendimiento_historico.json
            salida/radar_necesidad.json
          if-no-files-found: error
          retention-days: 14
