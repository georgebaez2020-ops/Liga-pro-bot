name: Backfill histórico oficial

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Fecha inicial (YYYY-MM-DD)"
        required: true
        default: "2025-11-18"
        type: string
      to_date:
        description: "Fecha final (YYYY-MM-DD)"
        required: true
        default: "2026-11-17"
        type: string
      max_tournaments:
        description: "Máximo de torneos en esta ejecución"
        required: true
        default: "5000"
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verificar base de datos persistente
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configura el secreto DATABASE_URL antes de ejecutar el backfill. SQLite de Actions es temporal."
            exit 1
          fi
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Validar fechas y ejecutar backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HISTORICAL_FROM: ${{ inputs.from_date }}
          HISTORICAL_TO: ${{ inputs.to_date }}
          MAX_HISTORICAL_TOURNAMENTS: ${{ inputs.max_tournaments }}
          HISTORICAL_PAUSE_SECONDS: "0.3"
        run: |
          python -m py_compile backfill_historico.py db.py tablas_scraper.py
          python backfill_historico.py
      - name: Verificar persistencia PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HISTORICAL_FROM: ${{ inputs.from_date }}
          HISTORICAL_TO: ${{ inputs.to_date }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import date, timedelta
          from pathlib import Path
          import psycopg

          url = os.environ["DATABASE_URL"]
          if url.startswith("postgres://"):
              url = "postgresql://" + url[len("postgres://"):]
          desde = date.fromisoformat(os.environ["HISTORICAL_FROM"])
          hasta = date.fromisoformat(os.environ["HISTORICAL_TO"]) + timedelta(days=1)
          inicio = desde.isoformat() + "T00:00:00+00:00"
          fin = hasta.isoformat() + "T00:00:00+00:00"

          with psycopg.connect(url) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      "SELECT COUNT(DISTINCT tournament_id), COUNT(*) "
                      "FROM tournament_snapshots WHERE captured_at >= %s AND captured_at < %s",
                      (inicio, fin),
                  )
                  torneos, snapshots = cur.fetchone()
                  cur.execute(
                      "SELECT COUNT(*) FROM matches WHERE captured_at >= %s AND captured_at < %s",
                      (inicio, fin),
                  )
                  partidos = cur.fetchone()[0]

          verificacion = {
              "desde": desde.isoformat(),
              "hasta": (hasta - timedelta(days=1)).isoformat(),
              "torneos_con_snapshot": torneos,
              "snapshots": snapshots,
              "partidos_persistidos": partidos,
          }
          ruta = Path("salida/backfill_historico.json")
          data = json.loads(ruta.read_text(encoding="utf-8"))
          data["verificacion_postgres"] = verificacion
          ruta.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(verificacion, ensure_ascii=False))
          if torneos == 0 or snapshots == 0:
              raise SystemExit("PostgreSQL no contiene snapshots históricos en el rango solicitado")
          PY
      - name: Publicar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-backfill-historico
          path: salida/backfill_historico.json
          if-no-files-found: ignore
          retention-days: 14
