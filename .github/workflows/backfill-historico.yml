name: Backfill histórico oficial

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: "Fecha inicial (YYYY-MM-DD)"
        required: true
        default: "2025-11-18"
        type: string
      to_date:
        description: "Fecha final (YYYY-MM-DD)"
        required: true
        default: "2026-11-17"
        type: string
      max_tournaments:
        description: "Máximo de torneos en esta ejecución"
        required: true
        default: "300"
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verificar base de datos persistente
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Configura el secreto DATABASE_URL antes de ejecutar el backfill. SQLite de Actions es temporal."
            exit 1
          fi
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Validar fechas y ejecutar backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HISTORICAL_FROM: ${{ inputs.from_date }}
          HISTORICAL_TO: ${{ inputs.to_date }}
          MAX_HISTORICAL_TOURNAMENTS: ${{ inputs.max_tournaments }}
          HISTORICAL_PAUSE_SECONDS: "0.3"
        run: |
          python -m py_compile backfill_historico.py db.py tablas_scraper.py
          python backfill_historico.py
      - name: Publicar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-backfill-historico
          path: salida/backfill_historico.json
          if-no-files-found: ignore
          retention-days: 14
