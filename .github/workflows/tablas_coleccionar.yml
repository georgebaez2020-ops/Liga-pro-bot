name: Coleccionar Historicos

on:
  workflow_dispatch:

jobs:
  coleccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar
        run: pip install -r requirements.txt
      - name: Instalar navegador Playwright
        run: playwright install chromium --with-deps
      - name: Bajar datos viejos
        run: |
          git fetch origin datos || true
          git checkout origin/datos -- data/tablas.json || mkdir -p data
          ls -lh data/
      - name: Coleccionar 8 meses
        run: python coleccionar.py
      - name: Guardar en datos
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git checkout datos || git checkout -b datos
          git add data/tablas.json || git add tablas.json || true
          git commit -m "historicos coleccionados" || true
          git push origin datos || true
