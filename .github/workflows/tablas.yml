name: Tablas Liga Pro

on:
  push:
    branches:
      - feature/status-upcoming-live-finished
    paths:
      - 'tablas_scraper.py'
      - '.github/workflows/tablas.yml'
  workflow_dispatch:
    inputs:
      torneos:
        description: 'IDs o enlaces separados por coma (vacío = buscar por fecha)'
        required: false
        default: ''
      dia:
        description: 'Día en Colombia, AAAA-MM-DD (vacío = hoy)'
        required: false
        default: ''
      status:
        description: 'Estados: all, live, upcoming, finished o combinación separada por comas'
        required: false
        default: 'all'
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

concurrency:
  group: tablas-liga
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/status-upcoming-live-finished

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Extraer torneos y tablas
        env:
          TORNEOS: ${{ inputs.torneos }}
          DIA: ${{ inputs.dia }}
          STATUS: ${{ inputs.status || 'all' }}
          MAX_TORNEOS: '100'
          MAX_PAGINAS: '10'
        run: python tablas_scraper.py

      - name: Analizar historial de jugadores
        run: python analisis_jugadores.py

      - name: Mostrar resumen
        run: |
          python - <<'PY'
          import json
          with open('salida/tablas.json', encoding='utf-8') as f:
              data = json.load(f)
          print(json.dumps(data.get('resumen', {}), ensure_ascii=False, indent=2))
          print('Torneos guardados:', len(data.get('torneos', {})))
          PY

      - name: Guardar resultados de prueba
        uses: actions/upload-artifact@v4
        with:
          name: tablas-liga-pro
          path: salida/
          if-no-files-found: warn
          retention-days: 7
