name: Tablas Liga Pro

on:
  workflow_dispatch:
    inputs:
      torneos:
        description: 'IDs o enlaces separados por coma (vacío = buscar por fecha)'
        required: false
        default: ''
      dia:
        description: 'Día en Colombia, AAAA-MM-DD (vacío = hoy)'
        required: false
        default: ''
      status:
        description: 'Número de status de la página (vacío = todos)'
        required: false
        default: ''
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

concurrency:
  group: tablas-liga
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Extraer tablas
        env:
          TORNEOS: ${{ inputs.torneos }}
          DIA: ${{ inputs.dia }}
          STATUS: ${{ inputs.status }}
        run: python scraper.py

      - name: Guardar en la rama datos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin datos:datos 2>/dev/null || true
          if git show-ref --verify --quiet refs/heads/datos; then
            git checkout datos
          else
            git checkout --orphan datos
            git rm -rf . > /dev/null 2>&1 || true
          fi
          mkdir -p data
          cp salida/* data/
          git add data
          if git diff --cached --quiet; then
            echo 'Sin cambios'
          else
            git commit -m 'Actualizar tablas'
            git push origin datos
          fi
