name: Tablas Liga Pro

on:
  push:
    branches:
      - feature/status-upcoming-live-finished
    paths:
      - 'tablas_scraper.py'
      - 'analisis_jugadores.py'
      - 'test_analisis_jugadores.py'
      - 'db.py'
      - 'requirements.txt'
      - '.github/workflows/tablas.yml'
  workflow_dispatch:
    inputs:
      torneos:
        description: 'IDs o enlaces separados por coma (vacío = buscar por fecha)'
        required: false
        default: ''
      dia:
        description: 'Día en Colombia, AAAA-MM-DD (vacío = hoy)'
        required: false
        default: ''
      status:
        description: 'Estados: all, live, upcoming, finished o combinación separada por comas'
        required: false
        default: 'all'
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

concurrency:
  group: tablas-liga
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/status-upcoming-live-finished

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install playwright "psycopg[binary]==3.2.6"
          playwright install --with-deps chromium

      - name: Extraer torneos y tablas
        env:
          TORNEOS: ${{ inputs.torneos }}
          DIA: ${{ inputs.dia }}
          STATUS: ${{ inputs.status || 'all' }}
          MAX_TORNEOS: '100'
          MAX_PAGINAS: '10'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERROR: falta el secreto DATABASE_URL; se cancela para no guardar accidentalmente en SQLite."
            exit 1
          fi
          python tablas_scraper.py

      - name: Verificar registros guardados en PostgreSQL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import psycopg

          url = os.environ.get("DATABASE_URL", "")
          if not url:
              raise SystemExit("ERROR: falta DATABASE_URL en la verificación.")

          with psycopg.connect(url) as conn:
              with conn.cursor() as cur:
                  tables = ("tournaments", "tournament_snapshots", "players",
                            "tournament_players", "matches")
                  counts = {}
                  for table in tables:
                      cur.execute(f"SELECT COUNT(*) FROM {table}")
                      counts[table] = cur.fetchone()[0]

          print("REGISTROS CONFIRMADOS EN POSTGRESQL:")
          for table, count in counts.items():
              print(f"{table}: {count}")

          if not any(counts.values()):
              raise SystemExit("ERROR: la conexión funciona, pero las tablas están vacías.")
          if counts["tournaments"] == 0:
              raise SystemExit("ERROR: no hay torneos guardados.")
          PY

      - name: Probar analizador de jugadores
        run: python -m unittest test_analisis_jugadores.py

      - name: Analizar historial de jugadores
        run: python analisis_jugadores.py

      - name: Mostrar resumen
        run: |
          python - <<'PY'
          import json
          with open('salida/tablas.json', encoding='utf-8') as f:
              data = json.load(f)
          print(json.dumps(data.get('resumen', {}), ensure_ascii=False, indent=2))
          print('Torneos guardados:', len(data.get('torneos', {})))
          PY

      - name: Guardar resultados de prueba
        uses: actions/upload-artifact@v4
        with:
          name: tablas-liga-pro
          path: salida/
          if-no-files-found: warn
          retention-days: 7
